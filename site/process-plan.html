</style><!-- /OC_THEME --></head><body class="learning-site"><a class="site-skip" href="#main-content">跳至正文</a><header id="site-header"><a class="site-brand" href="index.html"><span class="site-mark">OC</span><span>有机化学工场<small>GTNH · ORGANIC CHEMISTRY</small></span></a><nav aria-label="全站导航"><a href="index.html">首页 / 总路线</a><a href="learning.html">学习路线</a><a href="wiki.html">Wiki</a><a href="mechanisms.html">机理课堂</a><a href="plants.html">设备与产线</a><a href="line-bus.html">总线与回收</a><a href="play.html">游戏指南</a></nav></header><main id="main-content" class="learning-main"><section><div class="eyebrow">REFERENCE ARCHIVE</div><h1>M6 复盘与后续计划 · GTNH-OC</h1><p>这是研究规格、化学证据审查或阶段实施文档。原排期与版本描述属于当时的设计快照；当前学习路径和支持状态以统一 Wiki 与产线导览为准。</p><div class="learning-actions"><a class="learn-button primary" href="archive/process-plan.html">阅读原始详细文档</a><a class="learn-button" href="developer.html">查看当前开发目标</a><a class="learn-button" href="plants.html">进入产线导览</a></div></section></main><footer class="site-footer"><span>GTNH-OC · 更少的反应，更完整的理解。</span><span><a href="developer.html">开发与证据</a><a href="developer.html#sources">来源与表示范围</a><a href="vendor/3Dmol-LICENSE.txt">3Dmol.js 许可证</a></span></footer><script>(()=>{'use strict';

 $('knowledge-detail').innerHTML=`<div class="eyebrow">MOLECULE / ${esc(r.slug)}</div><h2>${esc(r.name)}</h2><span class="tag">${registryLabel(r)}</span><span class="tag ${r.kind==='formal-component'?'formal':''}">${r.kind==='formal-component'?'形式组分':r.kind==='research-reference'?'规划身份':'分子结构'}</span><div class="structure-card">${r.visual?`<div class="view-tabs"><button id="show-2d" aria-pressed="true">二维结构</button><button id="show-3d" aria-pressed="false" ${r.visual.sdf?'':'disabled'}>三维构象</button></div><div id="knowledge-2d">${r.visual.svg}</div><div id="knowledge-3d" role="application" aria-label="三维分子，可拖拽旋转、滚轮缩放或方向键旋转" tabindex="0" hidden></div><div id="knowledge-controls" hidden><div class="molecule-keys"><label>选择原子 <select id="knowledge-atoms"></select></label><button class="learn-button" id="knowledge-reset">复位</button><button class="learn-button" id="knowledge-turn">旋转</button></div><div id="knowledge-atom" aria-live="polite">点击原子查看相邻连接。</div></div>`:`<div class="empty-state">${r.kind==='formal-component'?'此条目用形式组分记录元素与当量。<br>不伪造单分子三维结构。':'此条目属于规划参考，未冻结可展示的结构资产。'}</div>`}</div><dl><dt>分子式</dt><dd><strong>${esc(r.formula)}</strong></dd><dt>官能团</dt><dd>${esc(r.family.join('、')||'见形式组分定义')}</dd><dt>SMILES</dt><dd><code>${esc(r.smiles||'不适用 / 未冻结')}</code></dd><dt>结构身份</dt><dd><code>${esc(r.recordId||'未注册游戏身份')}</code></dd><dt>立体范围</dt><dd>${esc(r.stereo)}</dd></dl><h3>它在产线中做什么</h3><p>${esc(r.role)}</p><h3>从结构中观察什么</h3><p>${esc(r.observe)}</p><h3>反应前后关系</h3>${links(reactions,x=>`<a href="#reaction-${x.id}">${esc(x.id+' · '+x.name)}</a>`)}<h3>在哪些设备中查到它</h3>${links(devices,x=>`<a href="#device-${x.id}">${esc(x.groupName+' / '+x.role+' · '+x.name)}</a>`)}<p class="audit-note">维生素 A 设备关联来自参考批次非零库存；基础设备按操作范围关联。具体含义见设备档案，不是通用接口白名单。</p><h3>模型边界</h3><p>${esc(r.limit)}</p>${r.visual?`<p class="audit-note">${esc(r.visual.method)} 未指定的立体构型不会因出现一个三维构象而得到确认。</p>`:''}<p><a href="plants.html">回到产线导览 →</a></p>`;

function reaction(r){const lessons=D.lessons.filter(x=>r.lessons.includes(x.id)),sources=D.sources.filter(x=>r.sources.includes(x.id));$('knowledge-detail').innerHTML=`<div class="eyebrow">REACTION / ${esc(r.id)}</div><h2>${esc(r.name)}</h2><span class="tag ${r.status}">${status[r.status]}</span><div class="formula-equation">${equationPart(r.reactants)}<br>→ ${equationPart(r.products)}</div><p class="audit-note">净计量式；可逆性、旁观离子和辅助物料请结合机理课与工段说明，不等同于一步基元反应。</p><h3>${esc(r.question)}</h3><p>${esc(r.teaching)}</p><h3>从动画中学习</h3>${links(lessons,l=>`<a href="${lessonURL(l)}">${esc(l.title)} · ${l.states} 状态 →</a>`)}<h3>适用范围与未解决的问题</h3><p class="learning-note">${esc(r.limit)}</p>${applied(r)}<h3>怎样进入游戏操作</h3><p>${r.status==='implemented'?'先从产线导览选择工段，再按对应操作手册完成进料与状态检查。净式中的系数不能代替实际投料清单。':r.status==='research'?'当前仅有只读守恒试算和教学动画，没有可点击的游戏生产操作。':r.status==='comparison'?'作为比较/分支记录阅读；不能把此净式直接视为独立游戏按钮。':'此反应仍为规划内容，当前没有操作手册可执行。'}</p><a href="plants.html">查看产线与设备入口 →</a><h3>来源与证据</h3>${sources.map(s=>`<p><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a><br><small>${esc(s.readStatus)}；${esc(s.boundary)}</small></p>`).join('')||'<p>教学模型的来源说明、结构核对与待审项目见关联课程。净式守恒只验证元素账，不建立工业速率或独立化学审阅结论。</p>'}`;}
function device(r){if(r.definition){const d=r.definition;$('knowledge-detail').innerHTML=`<div class="eyebrow">DEVICE / ${esc(r.groupName)}</div><h2>${esc(d.name)}</h2><span class="tag ${r.id==='cstr'?'research':'game'}">${r.id==='cstr'?'网页解析课程 / 非游戏连续设备':r.id==='batch-line'?'八设备组合概览':'已有游戏接口'}</span><p>${esc(d.purpose)}</p><h3>输入与前提</h3><p>${esc(d.inputs)}</p><h3>输出与可观察量</h3><p>${esc(d.outputs)}</p><h3>怎样操作</h3><p>${esc(d.operation)}</p><div class="learning-actions"><a class="learn-button primary" href="${r.manual}">打开操作与示范</a><a class="learn-button" href="${r.page}">相关教学实验</a></div><h3>涉及的分子与组分</h3>${links(r.compounds,id=>`<a href="#molecule-${id}">${esc(D.compounds.find(c=>c.slug===id)?.name||id)}</a>`)}<h3>模型边界</h3><p class="learning-note">${esc(d.analysis)}</p><p class="audit-note">本条为设备操作定义，未提供与维生素 A 参考批次同格式的最终库存快照。不要把无快照解释成机器为空。客户端渲染和操作仍需真人验收。</p>`;return;}$('knowledge-detail').innerHTML=`<div class="eyebrow">EQUIPMENT / ${esc(r.groupName)}</div><h2>${r.role} 号 · ${esc(r.name)}</h2><span class="tag game">已有游戏面板</span><p>在${esc(r.groupName)}工段中找到这一设备，右键打开。读取库存和阶段后，再执行手册中的下一步。</p><div class="learning-actions"><a class="learn-button primary" href="${r.manual}">按手册操作</a><a class="learn-button" href="${r.page}#inventory-section">观察工段库存</a></div><h3>右键界面应关注什么</h3><ol><li>机器角色、所属工段与当前阶段是否正确。</li><li>各组分的 mol 与残余库存；总量不等于纯品量。</li><li>操作按钮与具体拒绝原因；已提交后再看下一状态。</li><li>曲线的横轴：乙酰化釜为模型时间，其余工段多为已提交工序。</li></ol><h3>参考批次结束时的库存</h3><div class="table-wrap"><table class="learning-table"><thead><tr><th>分区</th><th>组分</th><th>mol</th></tr></thead><tbody>${['liquid','gas','solid','adsorbed'].flatMap(p=>Object.entries(r.inventory[p]||{}).filter(([,n])=>n).map(([id,n])=>`<tr><td>${({liquid:'液流账',gas:'气体账',solid:'固体账',adsorbed:'吸附账'})[p]}</td><td><a href="#molecule-${id}">${esc(D.compounds.find(c=>c.slug===id)?.name||id)}</a></td><td>${Number(n).toPrecision(6)}</td></tr>`)).join('')||'<tr><td colspan="3">此参考快照中为空；请阅读工段操作次序。</td></tr>'}</tbody></table></div><p class="audit-note">固定验收快照；不是
